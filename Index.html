<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #020509;
      color: #00eaff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 450px;
      text-align: center;
    }

    h1 {
      letter-spacing: 7px;
      text-shadow: 0 0 15px #00eaff;
    }

    .setup {
      margin-top: 30px;
      padding: 25px;
      border: 1px solid #00eaff;
      border-radius: 12px;
      background: #031016;
      box-shadow: 0 0 20px #003b45;
    }

    input {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: 1px solid #00eaff;
      border-radius: 8px;
      background: #020509;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: 1px solid #00eaff;
      border-radius: 8px;
      background: #031016;
      color: #00eaff;
      font-weight: bold;
    }

    #jarvis {
      display: none;
    }

    #status {
      margin-top: 15px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>J.A.R.V.I.S</h1>

  <!-- FIRST LAUNCH SETUP -->
  <div class="setup" id="setup">

    <h2>INITIAL SETUP</h2>

    <p>Enter your OpenAI API key</p>

    <input
      id="apiKey"
      type="password"
      placeholder="OpenAI API key"
    >

    <button onclick="connectJarvis()">
      CONNECT J.A.R.V.I.S
    </button>

    <div id="status"></div>

  </div>

  <!-- JARVIS -->
  <div id="jarvis">

    <h2>SYSTEM ONLINE</h2>

    <p>Your J.A.R.V.I.S body is ready.</p>

  </div>

</div>

<script>

function connectJarvis() {

  const key = document.getElementById("apiKey").value.trim();
  const status = document.getElementById("status");

  if (!key) {
    status.textContent = "Please enter your API key.";
    return;
  }

  /*
    TEMPORARY SETUP ONLY.

    We will replace this with secure Android
    storage when we turn J.A.R.V.I.S into
    the actual Android app.
  */

  localStorage.setItem("jarvisSetup", "true");

  document.getElementById("setup").style.display = "none";
  document.getElementById("jarvis").style.display = "block";
}


// Check whether setup was completed

window.onload = function() {

  if (localStorage.getItem("jarvisSetup") === "true") {

    document.getElementById("setup").style.display = "none";
    document.getElementById("jarvis").style.display = "block";

  }

};

</script>

</body>
</html>
