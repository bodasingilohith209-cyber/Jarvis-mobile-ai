<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #020509;
      color: #00eaff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .jarvis {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      letter-spacing: 6px;
    }

    #reply {
      min-height: 80px;
      margin: 25px 0;
      padding: 20px;
      border: 1px solid #00eaff;
      border-radius: 10px;
      background: #031016;
    }

    input {
      width: 65%;
      padding: 14px;
      border: 1px solid #00eaff;
      border-radius: 8px;
      background: #020509;
      color: white;
    }

    button {
      padding: 14px;
      margin-left: 5px;
      border: 1px solid #00eaff;
      border-radius: 8px;
      background: #031016;
      color: #00eaff;
    }
  </style>
</head>

<body>

  <div class="jarvis">

    <h1>J.A.R.V.I.S</h1>

    <p>● SYSTEM ONLINE</p>

    <div id="reply">
      Awaiting command...
    </div>

    <input
      id="message"
      type="text"
      placeholder="Talk to JARVIS"
    >

    <button onclick="sendMessage()">SEND</button>

  </div>

  <script>
    async function sendMessage() {

      const input = document.getElementById("message");
      const reply = document.getElementById("reply");

      const message = input.value.trim();

      if (!message) return;

      reply.textContent = "J.A.R.V.I.S is thinking...";

      try {

        const response = await fetch("/api/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        if (data.reply) {
          reply.textContent = data.reply;
        } else {
          reply.textContent = "J.A.R.V.I.S: " + data.error;
        }

      } catch (error) {

        reply.textContent =
          "Connection error. Brain is not connected.";

      }

      input.value = "";
    }
  </script>

</body>
</html>
